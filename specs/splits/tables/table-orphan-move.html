<!DOCTYPE html>
<html lang="en">
<head>
	<meta http-equiv="Content-Type" content="text/html;charset=utf-8"/>
	<title>Table orphan move</title>
	<script src="../../../dist/paged.polyfill.js"></script>
	<style>
		@page {
			size: 120mm 100mm;
			margin: 10mm;
		}
		body { font-family: sans-serif; font-size: 10px; margin: 0; }
		/* A tall lead block that consumes most of page 1, leaving room for only
		   the table header plus (at most) a row or two. Without orphan control
		   the table starts here, renders header + <=3 rows, then continues on
		   page 2 with a duplicated header. */
		.lead {
			height: 285px;
			border: 1px solid #999;
			padding: 4px;
			box-sizing: border-box;
		}
		table {
			width: 100%;
			border-collapse: collapse;
		}
		th, td {
			border: 1px solid #333;
			padding: 2px 4px;
			vertical-align: top;
			text-align: left;
		}
	</style>
</head>
<body>
<section>
	<div class="lead">Lead content that fills most of the first page.</div>
	<table>
		<thead>
		<tr>
			<th>ID</th>
			<th>Name</th>
			<th>Notes</th>
		</tr>
		</thead>
		<tbody id="rows"></tbody>
	</table>
</section>
<script>
	// Enough rows that the table must split across pages regardless of where
	// it starts.
	const tbody = document.getElementById("rows");
	for (let i = 1; i <= 40; i++) {
		const tr = document.createElement("tr");
		const id = document.createElement("td");
		id.textContent = String(i);
		const name = document.createElement("td");
		name.textContent = "name " + i;
		const notes = document.createElement("td");
		notes.textContent = "row " + i;
		tr.appendChild(id);
		tr.appendChild(name);
		tr.appendChild(notes);
		tbody.appendChild(tr);
	}
</script>
</body>
</html>
