<!DOCTYPE html>
<html lang="en">
<head>
	<meta http-equiv="Content-Type" content="text/html;charset=utf-8"/>
	<title>Split table layout-repeated loop</title>
	<script src="../../../dist/paged.polyfill.js"></script>
	<style>
		@page {
			/* Tall enough that no single row exceeds the page body, short enough
			   that the table splits across many pages. */
			size: 130mm 90mm;
			margin: 8mm;
		}
		body { font-family: sans-serif; font-size: 11px; }
		/* Auto table-layout (no explicit colgroup): page 1 sizes columns to its
		   own short rows, the split module captures those pixel widths and pins
		   them (table-layout:fixed) on every continuation. Later rows whose
		   Description needs more width than page 1 gave then wrap taller under
		   the pinned-narrow column; with rows kept whole the break point can
		   never advance and oscillates -> chunker "Layout repeated". Before the
		   fix this aborts the whole render, dropping every page after the cycle
		   (including all content that follows the table). */
		table {
			width: 100%;
			border-collapse: collapse;
		}
		th, td {
			border: 1px solid #333;
			padding: 2px 4px;
			vertical-align: top;
			text-align: left;
			overflow-wrap: anywhere;
			word-break: break-word;
		}
		tr { break-inside: avoid; }
	</style>
</head>
<body>
<section>
	<h3>Settings</h3>
	<table>
		<thead>
		<tr><th>Setting</th><th>Type</th><th>Range</th><th>Default</th><th>Proposed</th><th>Description</th></tr>
		</thead>
		<tbody id="rows"></tbody>
	</table>
	<p id="after-table">CONTENT_AFTER_TABLE</p>
</section>
<script>
	const tbody = document.getElementById("rows");
	const prose = "This parameter can be used to keep the server working in real time in presence of CSDR collection problems such as heavy loaded network or probe. Please note that if the setting is enabled the server can decide to discard data from some probes by disconnecting them for a while.";
	for (let i = 1; i <= 30; i++) {
		const tr = document.createElement("tr");
		const cells = [
			"Setting" + i,
			"Unsigned int",
			"0..2147483647",
			"0",
			"0",
			// First rows short (so page-1 capture pins a narrow Description
			// column); later rows carry long prose that overflows that width.
			(i >= 6 && i % 2 === 0) ? prose : ("desc " + i)
		];
		cells.forEach((text) => { const td = document.createElement("td"); td.textContent = text; tr.appendChild(td); });
		tbody.appendChild(tr);
	}
</script>
</body>
</html>
