<!DOCTYPE html>
<html lang="en">
<head>
	<meta http-equiv="Content-Type" content="text/html;charset=utf-8"/>
	<title>Table orphan — header overflows the page-bottom sliver</title>
	<script src="../../../dist/paged.polyfill.js"></script>
	<style>
		@page {
			size: 120mm 80mm;
			margin: 10mm;
		}
		body { font-family: sans-serif; font-size: 10px; margin: 0; }
		/* Lead block consumes the page down to a sliver shorter than the table's
		   (multi-line) header. The wide fixed-layout table therefore starts here
		   with too little room even for its header: the header overflows *inside*
		   its cells, so the overflow node is a <th> descendant. Orphan control
		   that only triggers on a structural (non-cell) overflow misses this and
		   strands the table — its header renders degenerately and splits across
		   the page boundary. */
		.lead {
			height: 200px;
			border: 1px solid #999;
			padding: 4px;
			box-sizing: border-box;
		}
		table {
			width: 100%;
			border-collapse: collapse;
			table-layout: fixed;
		}
		th, td {
			border: 1px solid #333;
			padding: 2px 4px;
			vertical-align: top;
			text-align: left;
			overflow-wrap: anywhere;
			word-break: break-word;
		}
	</style>
</head>
<body>
<section>
	<div class="lead">Lead content that fills most of the first page.</div>
	<table>
		<thead>
		<tr>
			<th>Setting</th><th>Type</th><th>Allowed range</th>
			<th>Default values</th><th>Proposed values</th><th>Description</th>
		</tr>
		</thead>
		<tbody id="rows"></tbody>
	</table>
</section>
<script>
	const tbody = document.getElementById("rows");
	for (let i = 1; i <= 40; i++) {
		const tr = document.createElement("tr");
		const cells = ["Setting" + i, "Unsigned int", "0..2147483647", "0", "0", "Description text for row " + i];
		cells.forEach((text) => { const td = document.createElement("td"); td.textContent = text; tr.appendChild(td); });
		tbody.appendChild(tr);
	}
</script>
</body>
</html>
